<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vérificateur de domaines</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-2: #0f1d2d;
        --panel: rgba(18, 31, 46, 0.94);
        --panel-strong: #101d2f;
        --card: rgba(23, 38, 54, 0.92);
        --card-soft: rgba(30, 46, 64, 0.8);
        --text: #ecf3ff;
        --muted: #9eb0c9;
        --primary: #4f8ef7;
        --primary-2: #7cc7ff;
        --success: #39d98a;
        --success-soft: rgba(57, 217, 138, 0.14);
        --danger: #ff6b6b;
        --danger-soft: rgba(255, 107, 107, 0.14);
        --border: rgba(255,255,255,0.08);
        --shadow: 0 22px 50px rgba(3, 8, 18, 0.42);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(79, 142, 247, 0.14), transparent 30%),
          radial-gradient(circle at bottom right, rgba(124, 199, 255, 0.08), transparent 35%),
          linear-gradient(180deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      .container {
        max-width: 1180px;
        margin: 40px auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
        letter-spacing: -0.04em;
      }

      .header-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(79,142,247,0.25);
        background: rgba(79,142,247,0.08);
        color: var(--primary-2);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .header-badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 5px rgba(57, 217, 138, 0.18);
      }

      .input-shell {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        background: rgba(9,16,24,0.72);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 14px;
        color: var(--text);
        padding: 16px 18px;
        font-size: 14px;
        line-height: 1.6;
        resize: vertical;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea:focus {
        border-color: rgba(79,142,247,0.7);
        box-shadow: 0 0 0 4px rgba(79,142,247,0.12);
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      #checkBtn {
        background: linear-gradient(135deg, var(--primary), #5ca5ff);
        color: white;
        box-shadow: 0 12px 24px rgba(79,142,247,0.28);
      }

      .secondary {
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .summary {
        margin-top: 26px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }

      .stat {
        background: linear-gradient(180deg, rgba(30,46,64,0.95), rgba(19,31,45,0.9));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
      }

      .stat .label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
      }

      .stat .value {
        font-size: clamp(2rem, 5vw, 2.7rem);
        font-weight: 800;
        line-height: 1;
      }

      .progress-wrapper {
        display: none;
        margin-top: 22px;
        background: linear-gradient(180deg, rgba(26,39,55,0.95), rgba(15,25,36,0.9));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 18px 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      }

      .progress-wrapper.visible {
        display: block;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 14px;
        color: var(--muted);
      }

      .progress-track {
        position: relative;
        width: 100%;
        height: 20px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        position: relative;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, rgba(79,142,247,1), rgba(124,199,255,1));
        border-radius: inherit;
        box-shadow: 0 0 18px rgba(124,199,255,0.5);
        transition: width 0.3s ease;
      }

      .progress-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0.28), rgba(255,255,255,0));
      }

      .progress-status {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .progress-status strong {
        color: var(--text);
      }

      .counter-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 76px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(79,142,247,0.12);
        color: var(--primary-2);
        border: 1px solid rgba(79,142,247,0.3);
        font-weight: 800;
        font-size: 12px;
      }

      .result-box {
        margin-top: 26px;
        background: rgba(17,27,39,0.84);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
      }

      .result-box pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        color: var(--text);
      }

      .status {
        display: inline-block;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        margin-right: 8px;
      }

      .status.ok { background: var(--success-soft); color: var(--success); }
      .status.bad { background: var(--danger-soft); color: var(--danger); }

      .result-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 16px;
      }

      .list-panel {
        background: rgba(12,19,28,0.7);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        min-height: 240px;
      }

      .list-panel ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .list-panel li {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        word-break: break-all;
        font-size: 14px;
        line-height: 1.5;
      }

      .list-panel .ok {
        border-color: rgba(57, 217, 138, 0.5);
      }

      .list-panel .ko {
        border-color: rgba(255,107,107,0.7);
      }

      .list-panel .badge {
        display: inline-flex;
        align-items: center;
        margin-bottom: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .badge.ok {
        background: var(--success-soft);
        color: var(--success);
      }

      .badge.ko {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .result-json {
        margin-top: 18px;
        background: rgba(7, 13, 21, 0.9);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }

      button:disabled {
        opacity: 0.75;
        cursor: wait;
      }

      @media (max-width: 760px) {
        .panel { padding: 18px; }
        .result-layout { grid-template-columns: 1fr; }
      }

      @media (max-width: 640px) {
        .container { padding: 12px; }
        .panel { padding: 14px; }
        .actions { flex-direction: column; }
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <div class="page-header">
          <h1>Vérificateur de domaines</h1>
          <span class="header-badge">Live check</span>
        </div>

        <div class="input-shell">
          <textarea id="domainInput">[
  { "domain": "https://dtradn.teste.cn?code=1234456" },
  { "domain": "https://dtradn.dfsdf.cn" },
  { "domain": "https://example.com" }
]</textarea>
        </div>

        <div class="actions">
          <button id="checkBtn">Tester les liens</button>
          <button class="secondary" id="sampleBtn">Exemple</button>
        </div>

        <div id="progressWrapper" class="progress-wrapper">
          <div class="progress-header">
            <span id="progressLabel">Vérification en cours...</span>
            <span class="counter-chip" id="progressPercent">0%</span>
          </div>
          <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <div class="progress-header" style="margin-top:10px; margin-bottom:0;">
            <span class="progress-status"><strong id="progressStatusText">Préparation du test...</strong></span>
            <span class="counter-chip" id="progressCounter">0 / 0</span>
          </div>
        </div>

        <div class="summary">
          <div class="stat">
            <div class="label">Total</div>
            <div class="value" id="totalCount">0</div>
          </div>
          <div class="stat">
            <div class="label">Accessibles</div>
            <div class="value" id="accessibleCount">0</div>
          </div>
          <div class="stat">
            <div class="label">Inaccessibles</div>
            <div class="value" id="inaccessibleCount">0</div>
          </div>
        </div>

        <div class="result-box">
          <div id="resultOutput"><pre>Le rapport apparaîtra ici.</pre></div>
        </div>
      </div>
    </div>

    <script>
      const sample = `[
  { "domain": "https://dtradn.teste.cn?code=1234456" },
  { "domain": "https://dtradn.dfsdf.cn" },
  { "domain": "https://example.com" },
  { "domain": "https://www.google.com" }
]`;

      const input = document.getElementById('domainInput');
      const resultOutput = document.getElementById('resultOutput');
      const totalCount = document.getElementById('totalCount');
      const accessibleCount = document.getElementById('accessibleCount');
      const inaccessibleCount = document.getElementById('inaccessibleCount');
      const progressWrapper = document.getElementById('progressWrapper');
      const progressLabel = document.getElementById('progressLabel');
      const progressPercent = document.getElementById('progressPercent');
      const progressFill = document.getElementById('progressFill');
      const progressCounter = document.getElementById('progressCounter');
      const progressStatusText = document.getElementById('progressStatusText');
      const checkBtn = document.getElementById('checkBtn');

      function updateProgress(percent, label, progressText = '', counterText = null) {
        const safePercent = Math.max(0, Math.min(100, percent));
        progressLabel.textContent = label;
        progressPercent.textContent = `${Math.round(safePercent)}%`;
        progressFill.style.width = `${safePercent}%`;

        if (progressText) {
          progressStatusText.textContent = progressText;
        }

        if (counterText !== null) {
          progressCounter.textContent = counterText;
        }
      }

      function showProgress() {
        progressWrapper.classList.add('visible');
      }

      function hideProgress() {
        progressWrapper.classList.remove('visible');
      }

      function renderLists(data) {
        const accessible = data.accessible || [];
        const inaccessible = data.inaccessible || [];

        const renderList = (items, type) => {
          if (!items.length) {
            return `<li style="opacity:0.7;">Aucun domaine ${type === 'ok' ? 'accessible' : 'inaccessible'}.</li>`;
          }

          return items.map(item => `
            <li class="${type === 'ok' ? 'ok' : 'ko'}">
              ${item.domain}
            </li>
          `).join('');
        };

        return `
          <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap;">
            <span class="status ok">Accessibles: ${data.summary.accessible}</span>
            <span class="status bad">Inaccessibles: ${data.summary.inaccessible}</span>
          </div>

          <div class="result-layout">
            <div class="list-panel">
              <span class="badge ok">Accessibles</span>
              <ul>${renderList(accessible, 'ok')}</ul>
            </div>
            <div class="list-panel">
              <span class="badge ko">Inaccessibles</span>
              <ul>${renderList(inaccessible, 'ko')}</ul>
            </div>
          </div>

          <div class="result-json">
            <pre>${JSON.stringify(data, null, 2)}</pre>
          </div>
        `;
      }

      document.getElementById('sampleBtn').addEventListener('click', () => {
        input.value = sample;
      });

      document.getElementById('checkBtn').addEventListener('click', async () => {
        try {
          const raw = input.value.trim();
          if (!raw) {
            throw new Error('Le champ JSON est vide.');
          }

          const payload = JSON.parse(raw);
          const items = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.domains) ? payload.domains : []);

          if (!items.length) {
            throw new Error('Aucune liste de domaines détectée.');
          }

          checkBtn.disabled = true;
          showProgress();
          const total = items.length;
          updateProgress(0, 'Préparation du test', 'Validation de la liste en cours...', `0 / ${total}`);

          const response = await fetch('/api/check-domains', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Erreur lors du traitement');
          }

          totalCount.textContent = data.summary.total;
          accessibleCount.textContent = data.summary.accessible;
          inaccessibleCount.textContent = data.summary.inaccessible;

          updateProgress(100, 'Test terminé', `Résultats générés : ${data.summary.accessible} accessibles / ${data.summary.inaccessible} inaccessibles`, `${total} / ${total}`);
          resultOutput.innerHTML = renderLists(data);
          setTimeout(() => hideProgress(), 1400);
        } catch (error) {
          totalCount.textContent = '0';
          accessibleCount.textContent = '0';
          inaccessibleCount.textContent = '0';
          updateProgress(0, 'Erreur', 'Le test a échoué', '0 / 0');
          hideProgress();
          resultOutput.innerHTML = `<pre>Erreur : ${error.message}</pre>`;
        } finally {
          checkBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
